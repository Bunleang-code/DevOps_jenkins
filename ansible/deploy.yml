---
- name: Deploy Laravel Application
  hosts: laravel_server
  become: true
  vars:
    deploy_path: /var/www/lo_bunleang

  tasks:
    - name: Ensure deploy directory exists
      file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'

    - name: Fix git safe directory
      command: git config --global --add safe.directory /var/www/lo_bunleang

    - name: Clone or pull latest code
      git:
        repo: https://github.com/Bunleang-code/DevOps_jenkins.git
        dest: "{{ deploy_path }}"
        version: tp03
        force: yes

    - name: Copy built assets to server
      copy:
        src: "{{ lookup('env', 'WORKSPACE') }}/public/build/"
        dest: "{{ deploy_path }}/public/build/"
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy .env file
      copy:
        src: "{{ deploy_path }}/.env.example"
        dest: "{{ deploy_path }}/.env"
        remote_src: yes
        force: no

    - name: Install Composer dependencies
      command: composer install --no-dev --optimize-autoloader
      args:
        chdir: "{{ deploy_path }}"

    - name: Generate application key
      command: php artisan key:generate
      args:
        chdir: "{{ deploy_path }}"

    - name: Clear and cache config
      shell: |
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache
      args:
        chdir: "{{ deploy_path }}"

    - name: Set proper permissions
      file:
        path: "{{ deploy_path }}"
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes

    - name: Restart PHP-FPM
      systemd:
        name: php8.2-fpm
        state: restarted
      ignore_errors: yes

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded
      ignore_errors: yes

