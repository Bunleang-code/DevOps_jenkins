---
- name: Deploy Laravel Application
  hosts: laravel_server
  become: true
  vars:
    deploy_path: /var/www/laravel
    app_name: "{{ lookup('env', 'APP_NAME') | default('my-laravel-app') }}"

  tasks:
    - name: Ensure deploy directory exists
      file:
        path: "{{ deploy_path }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy Laravel files to server
      synchronize:
        src: "{{ lookup('env', 'WORKSPACE') }}/"
        dest: "{{ deploy_path }}/"
        delete: yes
        recursive: yes
        rsync_opts:
          - "--exclude=.env"
          - "--exclude=.git"
          - "--exclude=vendor"
          - "--exclude=node_modules"

    - name: Copy .env file from template
      template:
        src: "{{ lookup('env', 'WORKSPACE') }}/.env.example"
        dest: "{{ deploy_path }}/.env"
        owner: www-data
        group: www-data
        mode: '0644'
      ignore_errors: yes

    - name: Install Composer dependencies
      command: composer install --no-dev --optimize-autoloader
      args:
        chdir: "{{ deploy_path }}"
      become_user: www-data

    - name: Generate application key
      command: php artisan key:generate
      args:
        chdir: "{{ deploy_path }}"
      become_user: www-data

    - name: Run database migrations
      command: php artisan migrate --force
      args:
        chdir: "{{ deploy_path }}"
      become_user: www-data
      ignore_errors: yes

    - name: Install NPM dependencies
      command: npm install
      args:
        chdir: "{{ deploy_path }}"
      become_user: www-data

    - name: Build frontend assets
      command: npm run build
      args:
        chdir: "{{ deploy_path }}"
      become_user: www-data

    - name: Clear and cache config
      command: |
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache
      args:
        chdir: "{{ deploy_path }}"
      become_user: www-data

    - name: Set proper permissions
      file:
        path: "{{ deploy_path }}"
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes

    - name: Restart PHP-FPM
      systemd:
        name: php8.2-fpm
        state: restarted
      ignore_errors: yes

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded
      ignore_errors: yes
